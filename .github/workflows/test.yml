name: Test

# Pushes to main are tested by Release, which calls this workflow before release-please.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build packages
        run: npm run build

      # Stencil regenerates packages/webcomponents-react/src/components.ts on every build.
      - name: Check generated files are committed
        run: git diff --exit-code

      # Release deploys this build of the demo site to gh-pages. In a called workflow,
      # github.event_name is the caller's event, so pull requests skip the upload.
      - name: Upload demo site
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: www
          path: packages/webcomponents/www
          if-no-files-found: error
          retention-days: 1
